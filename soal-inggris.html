 if(x.p>=0)h+='<p class="pass">'+P[x.p]+'</p>';
 h+='<p class="q">'+x.s+'</p>';
 x.o.forEach(function(t,k){var c='';if(done){if(k===x.a)c=' ok';else if(k===A[i])c=' no'}h+='<button class="o'+c+'" data-k="'+k+'"'+(done?' disabled':'')+'><b>'+"ABCD"[k]+'.</b>'+t+'</button>'});
 h+='</div><div style="display:flex;gap:8px"><button class="btn" id="pv" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)"'+(i?'':' disabled')+'>Kembali</button><button class="btn" id="nx">'+(i+1<L.length?'Lanjut':'Lihat hasil')+'</button></div>';
 el(h);
 var bs=app.querySelectorAll(".o");
 bs.forEach(function(b){b.onclick=function(){
  if(done)return;done=true;var k=+b.dataset.k;A[i]=k;
  if(k===x.a){b.classList.add("ok")}else{b.classList.add("no");bs[x.a].classList.add("ok")}
  bs.forEach(function(y){y.disabled=true});
  document.querySelector(".top span:last-child").textContent="Skor: "+score();
 }});
 document.getElementById("nx").onclick=function(){i++;i<L.length?show():finish()};
 document.getElementById("pv").onclick=function(){if(i){i--;show()}};
 function go(){var n=parseInt(document.getElementById("jn").value,10);if(n>=1&&n<=L.length){i=n-1;show()}}
 document.getElementById("jb").onclick=go;
 document.getElementById("jn").onkeydown=function(e){if(e.key==="Enter")go()};
 window.scrollTo(0,0);
}
function finish(){
 res=C.map(function(){return[0,0]});sc=0;L.forEach(function(x,j){if(A[j]!==undefined){res[x.c][1]++;if(A[j]===x.a){sc++;res[x.c][0]++}}});var p=Math.round(sc/L.length*100);
 var h='<h1>Hasil Quiz</h1><div class="card"><div class="big">'+sc+' / '+L.length+'</div><div class="mu" style="text-align:center">'+p+'% benar</div></div><div class="card">';
 res.forEach(function(r,k){if(r[1])h+='<div class="row"><span>'+C[k]+'</span><b>'+r[0]+'/'+r[1]+'</b></div>'});
 h+='</div><button class="btn" id="re">Ulangi</button>';
 el(h);document.getElementById("re").onclick=start;window.scrollTo(0,0);
}
start();
</script>
</body>
</html>
