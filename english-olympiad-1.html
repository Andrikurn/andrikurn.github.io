html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:12px}
.mu{color:var(--mu);font-size:.9rem}
select,button{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:10px 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;width:100%;margin-top:12px;cursor:pointer}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.top{display:flex;justify-content:space-between;margin:12px 0 6px}
.pass{border-left:4px solid var(--ac);padding:8px 12px;margin:0 0 12px;background:var(--bg);border-radius:6px;font-size:.95rem}
.q{font-weight:600;margin:0 0 12px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-top:8px;cursor:pointer}
.o b{margin-right:8px;color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok)}
.o.no{background:var(--nob);border-color:var(--no)}
.o:disabled{cursor:default;opacity:1;color:var(--tx)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.92rem}
.big{font-size:2.4rem;font-weight:700;text-align:center;margin:4px 0}
.btn:disabled{opacity:.5;cursor:default}
.jump{display:flex;align-items:center;gap:8px;margin:10px 0}
.jump input{width:90px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.jump button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.jump button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.g{color:var(--ok)}.r{color:var(--no)}.rc{white-space:nowrap}
</style>
</head>

function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.A)A=d.A;if(d&&typeof d.m==="number")mode=d.m}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({A:A,m:mode}))}catch(e){}}
function el(h){app.innerHTML=h}
function pick(){return mode<0?Q.slice():Q.filter(function(x){return x.c===mode})}
function answered(x){return A[x.k]!==undefined}
function score(){var s=0;L.forEach(function(x){if(A[x.k]===x.a)s++});return s}
function firstOpen(){for(var j=0;j<L.length;j++)if(!answered(L[j]))return j;return 0}
function info(){var l=pick(),n=l.filter(answered).length;return"Terjawab "+n+" dari "+l.length+" soal"+(n?" · jawaban tersimpan di perangkat ini":"")}
function start(){
 var o='<option value="-1">Semua bagian ('+Q.length+' soal)</option>';
 C.forEach(function(n,k){o+='<option value="'+k+'"'+(k===mode?" selected":"")+'>'+(k+1)+'. '+n+'</option>'});
 el('<h1>Latihan English Olympiad Ruangguru</h1><div class="mu">Tingkat provinsi · '+Q.length+' soal dari 4 bagian</div><div class="card"><label class="mu" for="sel">Pilih materi</label><select id="sel">'+o+'</select><div class="mu" id="inf">'+info()+'</div><button class="btn" id="go">Mulai / Lanjutkan</button><button class="btn sec" id="rc">Lihat rekap</button><button class="btn sec" id="rs">Hapus jawaban tersimpan</button></div>');
 var sel=document.getElementById("sel");
 function sync(){mode=+sel.value;document.getElementById("inf").textContent=info();save()}
 sel.onchange=sync;
 document.getElementById("go").onclick=function(){sync();L=pick();i=firstOpen();show()};
 document.getElementById("rc").onclick=function(){sync();L=pick();finish()};
 var rs=document.getElementById("rs"),armed=false;
 rs.onclick=function(){sync();if(!armed){armed=true;rs.textContent="Tekan sekali lagi untuk menghapus";return}
  pick().forEach(function(x){delete A[x.k]});save();start()};
}
function show(){
 var x=L[i],a=A[x.k],done=a!==undefined;
 var h='<div class="top mu"><span>Soal '+(i+1)+' / '+L.length+'</span><span id="sc">Skor: '+score()+'</span></div><div class="bar"><i style="width:'+((i+1)/L.length*100)+'%"></i></div><div class="jump"><label class="mu" for="jn">Ke soal no.</label><input id="jn" type="number" inputmode="numeric" min="1" max="'+L.length+'" value="'+(i+1)+'"><button id="jb">Pergi</button><button id="rk" class="sec">Rekap</button></div><div class="card"><div class="mu" style="margin-bottom:8px">'+C[x.c]+'</div>';
 if(x.p>=0)h+='<p class="pass">'+P[x.p]+'</p>';
 h+='<p class="q">'+x.s+'</p>';
 x.o.forEach(function(t,k){var c="";if(done){if(k===x.a)c=" ok";else if(k===a)c=" no"}h+='<button class="o'+c+'" data-k="'+k+'"'+(done?" disabled":"")+'><b>'+"ABCD"[k]+'.</b>'+t+'</button>'});
 h+='</div><div style="display:flex;gap:8px"><button class="btn sec" id="pv"'+(i?"":" disabled")+'>Kembali</button><button class="btn" id="nx">'+(i+1<L.length?"Lanjut":"Lihat hasil")+'</button></div>';
 el(h);
 var bs=app.querySelectorAll(".o");
 bs.forEach(function(b){b.onclick=function(){
  if(answered(x))return;var k=+b.dataset.k;A[x.k]=k;save();
  if(k===x.a)b.classList.add("ok");else{b.classList.add("no");bs[x.a].classList.add("ok")}
  bs.forEach(function(y){y.disabled=true});
  document.getElementById("sc").textContent="Skor: "+score();
 }});
 document.getElementById("nx").onclick=function(){i++;i<L.length?show():finish()};
 document.getElementById("pv").onclick=function(){if(i){i--;show()}};
 document.getElementById("rk").onclick=finish;
 function go(){var n=parseInt(document.getElementById("jn").value,10);if(n>=1&&n<=L.length){i=n-1;show()}}
 document.getElementById("jb").onclick=go;
 document.getElementById("jn").onkeydown=function(e){if(e.key==="Enter")go()};
 window.scrollTo(0,0);
}
function finish(){
 var res=C.map(function(){return{b:0,s:0,k:0}}),tb=0,ts=0;
 L.forEach(function(x){var a=A[x.k];if(a===undefined)res[x.c].k++;else if(a===x.a){res[x.c].b++;tb++}else{res[x.c].s++;ts++}});
 var tk=L.length-tb-ts,p=L.length?Math.round(tb/L.length*100):0;
 var h='<h1>Rekap Hasil</h1><div class="card"><div class="big">'+tb+' / '+L.length+'</div><div class="mu" style="text-align:center">'+p+'% benar</div><div class="row" style="margin-top:10px"><span class="g">Benar</span><b>'+tb+'</b></div><div class="row"><span class="r">Salah</span><b>'+ts+'</b></div><div class="row"><span class="mu">Belum dijawab</span><b>'+tk+'</b></div></div><div class="card"><div class="mu" style="margin-bottom:4px">Per materi</div>';
 res.forEach(function(r,k){var t=r.b+r.s+r.k;if(t)h+='<div class="row"><span>'+(k+1)+'. '+C[k]+'</span><span class="rc"><b class="g">✓ '+r.b+'</b> <b class="r">✗ '+r.s+'</b> <span class="mu">– '+r.k+'</span></span></div>'});
 h+='</div>';
 if(ts+tk)h+='<button class="btn" id="rt">Ulangi soal salah &amp; belum dijawab ('+(ts+tk)+')</button>';
 h+='<button class="btn sec" id="bk">Kembali ke soal</button><button class="btn sec" id="mn">Menu awal</button>';
 el(h);
 var rt=document.getElementById("rt");
 if(rt)rt.onclick=function(){var w=L.filter(function(x){return A[x.k]!==x.a});w.forEach(function(x){delete A[x.k]});save();L=w;i=0;show()};
 document.getElementById("bk").onclick=function(){if(L.length){i=firstOpen();show()}else start()};
 document.getElementById("mn").onclick=start;
 window.scrollTo(0,0);
}
load();
start();
</script>
</body>
</html>
